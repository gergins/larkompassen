<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Föräldraläge – Lärkompassen</title><link rel="stylesheet" href="../style.css"><style>.warning{background:#fff4df;padding:16px;border-left:4px solid #c28b22;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#eef4ff;padding:16px;border-radius:12px}.stat strong{display:block;font-size:1.5rem}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:10px}select{font:inherit;padding:10px}#page input{max-width:260px}.toolbar,.tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.selected{background:#2368b3;color:#fff;border-color:#2368b3}.topic,.planned{padding:15px;border:1px solid #dce5ef;border-radius:14px;margin:12px 0}.planned{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{background:#e5eaf1;height:9px;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#357bb9}.tablewrap{overflow-x:auto}.bars{display:flex;align-items:end;justify-content:space-around;min-height:130px;gap:8px}.barcol{display:flex;align-items:center;flex-direction:column;justify-content:end;min-width:28px}.bar{width:24px;background:#397fbe;border-radius:6px 6px 0 0}.barvalue{font-size:.8rem;color:#52677e}.warning{line-height:1.5}select{max-width:100%}@media(max-width:480px){.stat{padding:11px}.stat strong{font-size:1.3rem}.planned{flex-wrap:wrap}}</style></head><body><main id="page"></main><script src="../curriculum.js"></script><script src="./parent.js?v=1.4.0" defer></script></body></html>
