name: Verify Larkompassen navigation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify learning paths
        run: |
          node tests/verify.mjs
          node tests/question-count.mjs
          node tests/subjects.mjs
          node tests/random-practice.mjs
