name: Supabase availability heartbeat
on:
  schedule:
    # Spread outside of top-of-hour congestion; best-effort schedules.
    - cron: "17 6,14,22 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query isolated monitoring marker
        env:
          SUPABASE_URL: https://vogkpshnisidtzrkvjzs.supabase.co/
          SUPABASE_ANON_KEY: sb_publishable_0bgtbTbW2-bNr1pLDBa02g_cQprhQdW
        run: node scripts/supabase-heartbeat.mjs
