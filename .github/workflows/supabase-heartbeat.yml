name: Supabase availability heartbeat
on:
  schedule:
    # Once daily, with 0–10 minutes of operational jitter; not a pause-prevention guarantee.
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Spread scheduled checks to reduce simultaneous request spikes
        if: github.event_name == 'schedule'
        run: sleep "$(( RANDOM % 601 ))"
      - name: Query isolated monitoring marker
        env:
          SUPABASE_URL: https://vogkpshnisidtzrkvjzs.supabase.co/
          SUPABASE_ANON_KEY: sb_publishable_0bgtbTbW2-bNr1pLDBa02g_cQprhQdW
        run: node scripts/supabase-heartbeat.mjs
