name: Verify family profiles
on:
  pull_request:
    paths:
      - 'family.js'
      - 'index.html'
      - 'tests/family.test.cjs'
      - '.github/workflows/verify-family.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check family.js
      - name: Test family profile behavior
        run: node --test tests/family.test.cjs
